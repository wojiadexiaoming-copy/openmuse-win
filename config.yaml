      temperature: 0.2
      max_tokens: 8192
      supports_images: true
      fallback:
        enabled: true
        provider: openai_compatible
        base_url: https://aigw-gzgy2.cucloud.cn:8443/v1
        model: DeepSeek-V4-Flash
        temperature: 0.2
        max_tokens: 8192
        supports_images: true
      fallback_chain:
      - model: DeepSeek-V4-Flash
        base_url: https://aigw-gzgy2.cucloud.cn:8443/v1
        supports_images: true
        enabled: true
      - model: qwen3.8-flash
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        supports_images: true
        enabled: true
      - model: deepseek-v4.1-flash-1017
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        supports_images: true
