      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: deepseek-v4.1-flash-1017
      temperature: 0.3
      max_tokens: 2048
      supports_images: false
    fallback:
      model: DeepSeek-V4-Flash
      base_url: https://aigw-gzgy2.cucloud.cn:8443/v1
      supports_images: true
  critical_subagent_role: main
context:
  max_context_tokens: 128000
  compact_threshold: 0.8
  keep_tail_messages: 20
agent:
  max_iters: 25
  max_iters_hard: 100
  step_grant: 10
  max_turn_wall_clock_sec: 600
  turn_extension_sec: 180
  turn_max_extensions: 3
  subagent_max_iters: 20
  subagent_max_iters_hard: 60
  subagent_step_grant: 10
  subagent_max_turn_sec: 300
  subagent_turn_extension_sec: 120
  subagent_max_extensions: 2
  skill_review_sessions: 60
  workspace: .
  parallel_tools: false
  task_tracker: true
tools:
  shell_exec:
    enabled: true
    timeout_sec: 30
  web_search:
    enabled: false
    api_url: ''
    api_key_env: ALTEREGO_SEARCH_API_KEY
  browser:
    enabled: true
    headless: false
llm_router:
  enabled: false
  providers_file: docs/model-api-guide/llm_providers.yaml
desktop:
  enabled: true
  safe_mode: true
  takeover_timeout_sec: 300
media:
  api_key_env: ALTEREGO_MEDIA_API_KEY
  max_image_dimension: 2048
ui:
  host: 127.0.0.1
  port: 5000
  open_browser: true
weixin:
  enabled: false
  port: 5001
  token_ttl_hours: 72
  token_warn_hours: 12
retention:
  archive_days: 30
  upload_days: 30
  log_days: 14
  span_days: 14
