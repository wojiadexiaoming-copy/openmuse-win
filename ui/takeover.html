<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlterEgo 接管中</title>
<link rel="stylesheet" href="static/style.css">
<style>
  /* 浮窗专用：无边框小窗口，body 即整窗 */
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: rgba(32, 38, 52, 0.92);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    color: #fff;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-app-region: drag; /* Electron/pywebview 拖动区（按钮处排除） */
  }
  #bar {
    display: flex; align-items: center; gap: 10px;
    height: 100%; padding: 0 14px; box-sizing: border-box;
  }
  #bar .mascot {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5b6b8c, #2e3850);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    box-shadow: 0 0 12px rgba(120, 160, 255, .45);
  }
  #bar .info { flex: 1; min-width: 0; }
  #bar .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .timer { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
  #bar .timer.warn { color: #ffb84d; }
  #bar button {
    -webkit-app-region: no-drag;
    border: none; border-radius: 8px; padding: 8px 16px;
    font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  #btn-done { background: #22b573; color: #fff; }
  #btn-done:hover { background: #1da065; }
  #btn-cancel { background: rgba(255,255,255,.15); color: #fff; }
  #btn-cancel:hover { background: rgba(255,255,255,.25); }
  #bar.done { justify-content: center; }
</style>
</head>
<body>
<div id="bar">
  <div class="mascot">影</div>
  <div class="info">
    <div class="title" id="takeover-title">影仔 接管中</div>
    <div class="timer" id="takeover-timer">00:00</div>
  </div>
  <button id="btn-done">完成</button>
  <button id="btn-cancel">取消</button>
</div>
<script src="static/takeover.js"></script>
</body>
</html>
